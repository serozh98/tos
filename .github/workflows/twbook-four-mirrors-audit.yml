name: Check four user-supplied TWBook mirrors
on:
  push:
    branches: ['feature/twbook-1105578080']
    paths:
      - '.github/workflows/twbook-four-mirrors-audit.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect user-supplied book indexes and missing chapter links
        shell: bash
        run: |
          python - <<'PY'
          import requests, json, time, re, hashlib, pathlib
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse, urljoin
          from urllib.robotparser import RobotFileParser
          P=pathlib.Path('out/twbook-four-mirrors')
          P.mkdir(parents=True,exist_ok=True)
          sites=[
              ('novel543','https://www.novel543.com/0903678080/'),
              ('oop','https://www.oop.tw/abooka/a31292482a/'),
              ('pia66','https://www.pia66.com/piaos/s7GG8Q/2.html'),
              ('piaotianapp','https://www.piaotianapp.com/ptinfo/910678890.html'),
          ]
          selected=set([175,177,178,179,180,181,182,184,185])
          agent='TOSBookTranslationSourceAudit/1.0 (public metadata; rights confirmed by book project owner)'
          session=requests.Session()
          session.headers.update({'User-Agent':agent,'Accept-Language':'zh-TW,zh;q=0.9,en;q=0.6'})
          records=[]
          for name,url in sites:
              info={'site':name,'requested_url':url}
              try:
                  parsed=urlparse(url)
                  robot_url=f'{parsed.scheme}://{parsed.netloc}/robots.txt'
                  try:
                      z=session.get(robot_url,timeout=14)
                      info['robots_code']=z.status_code
                      if z.status_code==200:
                          rp=RobotFileParser();rp.parse(z.text.splitlines())
                          if not rp.can_fetch(agent,url):
                              info['status']='robots_disallowed';records.append(info);continue
                  except Exception as ex:
                      info['robots_error']=str(ex)[:160]
                  response=session.get(url,timeout=25,allow_redirects=True)
                  info['status_code']=response.status_code;info['final_url']=response.url;info['bytes']=len(response.content)
                  response.raise_for_status()
                  response.encoding=response.apparent_encoding or response.encoding or 'utf-8'
                  soup=BeautifulSoup(response.text,'html.parser')
                  info['title']=soup.title.get_text(' ',strip=True)[:250] if soup.title else ''
                  info['h1']=[x.get_text(' ',strip=True)[:120] for x in soup.select('h1')][:5]
                  text=soup.get_text(' ',strip=True)
                  info['matching_title']=any(x in text for x in ['閉嘴吧祖宗','闭嘴吧祖宗'])
                  info['hero_name']=any(x in text for x in ['溫小暖','温小暖'])
                  info['author']=any(x in text for x in ['與菲','与菲'])
                  info['preview']=text[:240]
                  info['challenge']=bool(re.search('cloudflare|captcha|access denied|請先登錄|403 Forbidden',text[:3500],re.I))
                  info['links_total']=len(soup.select('a[href]'))
                  chapters=[]
                  for a in soup.select('a[href]'):
                      label=a.get_text(' ',strip=True)
                      m=re.search(r'第\s*(\d{1,4})\s*章',label)
                      if not m:continue
                      n=int(m.group(1))
                      if n<160 or n>210:continue
                      link=urljoin(response.url,a['href'].strip())
                      if urlparse(link).netloc != urlparse(response.url).netloc:continue
                      chapters.append({'printed':n,'label':label[:115],'url':link})
                  info['chapters_160_210']=chapters
                  info['chapters_count']=len(chapters)
                  all_nums=sorted(set(x['printed'] for x in chapters))
                  info['numbers_visible']=all_nums
                  info['missing_174_185_in_visible_index']=[n for n in range(174,186) if n not in all_nums]
                  info['status']='matched_book' if info['matching_title'] or info['hero_name'] else 'unconfirmed_or_unrelated'
                  if info['status']=='matched_book':
                      by_num={}
                      for c in chapters:
                          by_num.setdefault(c['printed'],c)
                      visited=set()
                      for n in sorted(selected):
                          if n not in by_num:continue
                          link=by_num[n]['url']
                          if link in visited:continue
                          visited.add(link)
                          if len(visited)>9:break
                          if n!=min(selected):time.sleep(2)
                          rec={'printed':n,'url':link}
                          try:
                              rr=session.get(link,timeout=24)
                              rec['http_status']=rr.status_code;rr.raise_for_status()
                              rr.encoding=rr.apparent_encoding or rr.encoding or 'utf-8'
                              chapter_soup=BeautifulSoup(rr.text,'html.parser')
                              for g in chapter_soup.select('script,style,nav,footer,header,.advertisement,.ad'):
                                  g.decompose()
                              body_node=chapter_soup.select_one('div.chapter-content div.content') or chapter_soup.select_one('div.chapter-content') or chapter_soup.select_one('div#content') or chapter_soup.select_one('article') or chapter_soup.select_one('div.read-content') or chapter_soup.select_one('div.content') or chapter_soup
                              chapter_body=body_node.get_text('\n',strip=True)
                              rec['chars']=len(chapter_body);rec['sha256']=hashlib.sha256(chapter_body.encode('utf-8')).hexdigest()
                              rec['head']=chapter_body[:150];rec['tail']=chapter_body[-160:]
                              if len(chapter_body)>350 and sum('\u4e00'<=c<='\u9fff' for c in chapter_body)>130:
                                  (P/f'{name}_{n}.txt').write_text(chapter_body,encoding='utf-8')
                                  rec['saved_text']=True
                          except Exception as ex:rec['error']=str(ex)[:210]
                          info.setdefault('sampled_chapters',[]).append(rec)
                  records.append(info)
              except Exception as ex:
                  info['status']='unavailable';info['error']=str(ex)[:320];records.append(info)
          report={'book':'閉嘴吧祖宗！你一開口，皇宮塌了','goal':'Find authentic missing source chapters 175, 177-182, 184-185','sources':records}
          (P/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for r in records:
              print(json.dumps({'site':r['site'],'status':r.get('status'),'http':r.get('status_code'),'title':r.get('title'),'chapter_numbers':r.get('numbers_visible'),'missing':r.get('missing_174_185_in_visible_index'),'saved':len([x for x in r.get('sampled_chapters',[]) if x.get('saved_text')]),'error':r.get('error')},ensure_ascii=False))
          PY
      - name: Archive source audit and any validated source chapters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twbook-four-mirrors-audit
          path: out/twbook-four-mirrors/**
          retention-days: 3
          if-no-files-found: warn
