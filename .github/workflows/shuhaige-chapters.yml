name: Collect Chinese chapters (Shuhaige 360588)

on:
  push:
    paths:
      - 'tools/novel_ingest/shuhaige_collect.py'
      - 'tests/test_shuhaige_collect.py'
      - '.github/workflows/shuhaige-chapters.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      start:
        description: First chapter number
        required: true
        type: number
        default: 1
      end:
        description: Last chapter (maximum 10 per run)
        required: true
        type: number
        default: 5
      save_text:
        description: Save RAW text, not only catalog metadata
        required: true
        type: boolean
        default: false
      rights_confirmed:
        description: Confirm rights to obtain and store RAW text
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v


  catalog_probe:
    name: Public catalog check (PR only)
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check public catalog (no RAW text saved)
        run: |
          python tools/novel_ingest/shuhaige_collect.py \
            --start 1 --end 5 --out-dir out/shuhaige-360588
      - name: Show diagnostic report
        if: always()
        run: |
          if [ -f out/shuhaige-360588/summary.md ]; then
            cat out/shuhaige-360588/summary.md >> "$GITHUB_STEP_SUMMARY"
            cat out/shuhaige-360588/summary.md
          fi
      - name: Archive catalog manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuhaige-360588-catalog-audit
          path: out/shuhaige-360588/**
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_CHAPTER: ${{ inputs.start }}
      END_CHAPTER: ${{ inputs.end }}
      SAVE_TEXT: ${{ inputs.save_text }}
      RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Collect chapters
        shell: bash
        run: |
          args=(--start "$START_CHAPTER" --end "$END_CHAPTER" --out-dir out/shuhaige-360588)
          if [ "$SAVE_TEXT" = "true" ]; then args+=(--save-text); fi
          if [ "$RIGHTS_CONFIRMED" = "true" ]; then args+=(--rights-confirmed); fi
          python tools/novel_ingest/shuhaige_collect.py "${args[@]}"
      - name: Report
        if: always()
        run: |
          if [ -f out/shuhaige-360588/summary.md ]; then
            cat out/shuhaige-360588/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuhaige-360588-audit
          path: out/shuhaige-360588/**
          if-no-files-found: warn
          retention-days: 7
