name: CZBooks 77297 - chapters 328-553 catalog audit

on:
  push:
    paths:
      - 'tools/novel_ingest/czbooks_77297.py'
      - 'tests/test_czbooks_77297.py'
      - '.github/workflows/czbooks-77297-audit.yml'
  pull_request:
    paths:
      - 'tools/novel_ingest/czbooks_77297.py'
      - 'tests/test_czbooks_77297.py'
      - '.github/workflows/czbooks-77297-audit.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First chapter
        required: true
        type: number
        default: 328
      end:
        description: Last chapter
        required: true
        type: number
        default: 553
      save_text:
        description: Store authorized RAW text for at most 10 chapters
        required: true
        type: boolean
        default: false
      rights_confirmed:
        description: Confirm permission to obtain and store full text
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v

  catalog:
    needs: tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAPTER_START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || 328 }}
      CHAPTER_END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || 553 }}
      SAVE_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.save_text || false }}
      RIGHTS_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.rights_confirmed || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect public CZBooks catalog within site rules
        shell: bash
        run: |
          args=(--start "$CHAPTER_START" --end "$CHAPTER_END" --out-dir out/czbooks-77297)
          if [ "$SAVE_TEXT" = "true" ]; then args+=(--save-text); fi
          if [ "$RIGHTS_CONFIRMED" = "true" ]; then args+=(--rights-confirmed); fi
          python tools/novel_ingest/czbooks_77297.py "${args[@]}"
      - name: Report
        if: always()
        run: |
          if test -f out/czbooks-77297/summary.md; then
            cat out/czbooks-77297/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: czbooks-77297-audit
          path: out/czbooks-77297/**
          if-no-files-found: warn
          retention-days: 7
